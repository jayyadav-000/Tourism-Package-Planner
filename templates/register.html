{% extends 'base.html' %}{% block title %}Create account — Wanderly{% endblock %}{% block content %}
<section class="auth-page"><div class="auth-art auth-art-register"><div class="auth-art-sun"></div><span class="auth-art-emoji">✳</span><div class="auth-art-caption">COLLECT MOMENTS,<br>NOT JUST MILES.</div></div><div class="auth-form-wrap"><div class="eyebrow">JOIN THE JOURNEY</div><h1>Make room for<br><em>somewhere new.</em></h1><p class="auth-subtitle">Create your account and keep your trips in one place.</p><form method="post" class="auth-form"><label for="full_name">Full name</label><input id="full_name" name="full_name" placeholder="Your name" required autocomplete="name"><label for="email">Email address</label><input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email"><label for="phone">Phone number <small>(optional)</small></label><input id="phone" name="phone" placeholder="Your contact number" autocomplete="tel"><label for="password">Create password</label><input type="password" id="password" name="password" placeholder="At least 6 characters" minlength="6" required autocomplete="new-password"><button class="button button-dark button-full" type="submit">Create account <span>↗</span></button></form><p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p></div></section>
{% endblock %}
